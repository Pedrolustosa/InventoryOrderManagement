<div class="fixed inset-0 z-40 flex items-center justify-center bg-ink/40 p-4" role="dialog" aria-modal="true">
  <div class="w-full max-w-lg rounded-xl border border-line bg-panel p-5 shadow-lg">
    <h2 class="text-lg font-semibold text-ink">{{ 'RETURNS.DIALOGS.CANCEL_TITLE' | translate }}</h2>
    <p class="mt-2 text-sm text-muted">
      {{ 'RETURNS.DIALOGS.CANCEL_MSG' | translate: { number: returnNumber() } }}
    </p>

    <label class="mt-4 block text-sm font-medium text-ink">
      {{ 'RETURNS.DIALOGS.CANCELLATION_REASON' | translate }}
      <textarea class="field mt-1 min-h-24" [formControl]="reason" [attr.maxlength]="reasonMaxLength"></textarea>
    </label>
    @if (reasonError(); as errorKey) {
      <p class="mt-1 text-sm text-danger" role="alert">{{ errorKey | translate: { max: reasonMaxLength } }}</p>
    }
    @if (errorMessage()) {
      <p class="mt-2 text-sm text-danger" role="alert">{{ errorMessage() }}</p>
    }

    <div class="mt-5 flex justify-end gap-2">
      <button type="button" class="btn-secondary" [disabled]="isSubmitting()" (click)="dismiss()">
        {{ 'COMMON.BACK' | translate }}
      </button>
      <button type="button" class="btn-primary" [disabled]="isSubmitting()" (click)="submit()">
        @if (isSubmitting()) {
          {{ 'RETURNS.DIALOGS.CANCELLING' | translate }}
        } @else {
          {{ 'RETURNS.DIALOGS.CONFIRM_CANCEL' | translate }}
        }
      </button>
    </div>
  </div>
</div>
