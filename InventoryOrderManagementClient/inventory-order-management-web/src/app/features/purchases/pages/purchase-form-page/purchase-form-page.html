<section class="space-y-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="text-3xl font-semibold tracking-tight text-ink">
        {{ orderId ? 'Edit Draft Purchase' : 'Create Purchase' }}
      </h1>
      <p class="mt-2 max-w-2xl text-sm text-muted">
        Saving a draft does not receive stock. Enter the acquisition cost for each product.
      </p>
    </div>
    <a routerLink="/purchases" class="btn-secondary">Back to purchases</a>
  </div>

  @if (isLoading()) {
    <div class="flex items-center gap-3 text-muted" aria-busy="true">
      <span class="inline-block size-5 animate-spin rounded-full border-2 border-line border-t-accent"></span>
      <span>Loading purchase form...</span>
    </div>
  } @else if (loadError()) {
    <div class="rounded-md border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
      {{ loadError() }}
    </div>
  } @else if (!orderId || order()) {
    <section class="rounded-xl border border-line bg-panel p-5 shadow-sm sm:p-6">
      <app-purchase-order-form
        [mode]="orderId ? 'edit' : 'create'"
        [suppliers]="suppliers()"
        [products]="products()"
        [order]="order()"
        [isSubmitting]="isSubmitting()"
        [submitError]="submitError()"
        (saved)="save($event)"
        (cancelled)="back()"
      />
    </section>
  }
</section>
