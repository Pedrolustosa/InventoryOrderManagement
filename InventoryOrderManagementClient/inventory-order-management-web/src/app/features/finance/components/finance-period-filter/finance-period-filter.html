<div class="space-y-3">
  <div class="flex flex-wrap gap-2">
    @for (option of options; track option.id) {
      <button
        type="button"
        class="btn-secondary"
        [class.!bg-accent]="preset() === option.id"
        [class.!text-white]="preset() === option.id"
        (click)="preset.set(option.id)"
      >
        {{ option.labelKey | translate }}
      </button>
    }
  </div>

  @if (preset() === 'Custom') {
    <div class="grid gap-3 sm:grid-cols-2">
      <label class="block text-sm font-medium text-ink">
        {{ 'COMMON.START_DATE' | translate }}
        <input type="date" class="field mt-1" [value]="customStart()" (input)="customStart.set($any($event.target).value)" />
      </label>
      <label class="block text-sm font-medium text-ink">
        {{ 'COMMON.END_DATE' | translate }}
        <input type="date" class="field mt-1" [value]="customEnd()" (input)="customEnd.set($any($event.target).value)" />
      </label>
    </div>
  }

  <button type="button" class="btn-secondary" (click)="apply()">{{ 'FINANCE.FILTERS.APPLY_PERIOD' | translate }}</button>
  @if (error(); as err) {
    <p class="text-sm text-danger" role="alert">{{ err | translate }}</p>
  }
</div>
