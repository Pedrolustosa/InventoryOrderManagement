<div class="space-y-3">
  <div class="flex flex-wrap gap-2">
    @for (option of options; track option.id) {
      <button
        type="button"
        class="btn-secondary"
        [class.!bg-accent]="preset() === option.id"
        [class.!text-white]="preset() === option.id"
        (click)="preset.set(option.id)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  @if (preset() === 'Custom') {
    <div class="grid gap-3 sm:grid-cols-2">
      <label class="block text-sm font-medium text-ink">
        Start date
        <input type="date" class="field mt-1" [value]="customStart()" (input)="customStart.set($any($event.target).value)" />
      </label>
      <label class="block text-sm font-medium text-ink">
        End date
        <input type="date" class="field mt-1" [value]="customEnd()" (input)="customEnd.set($any($event.target).value)" />
      </label>
    </div>
  }

  <button type="button" class="btn-secondary" (click)="apply()">Apply period</button>
  @if (error()) {
    <p class="text-sm text-danger" role="alert">{{ error() }}</p>
  }
</div>
