<section class="mx-auto flex min-h-dvh max-w-md items-center px-4 py-12">
  <form class="w-full space-y-6 rounded-2xl border border-line bg-panel p-6 shadow-sm" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-accent">Inventory Order Management</p>
      <h1 class="mt-2 text-2xl font-semibold text-ink">Sign in</h1>
      <p class="mt-2 text-sm text-muted">Use the account provided by an administrator.</p>
    </div>

    @if (errorMessage()) {
      <p class="rounded-md border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <label class="block space-y-1 text-sm">
      <span class="font-medium text-ink">Email</span>
      <input class="field" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="text-danger">Enter a valid email address.</span>
      }
    </label>

    <label class="block space-y-1 text-sm">
      <span class="font-medium text-ink">Password</span>
      <span class="flex gap-2">
        <input
          class="field"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button type="button" class="btn-secondary shrink-0" (click)="showPassword.set(!showPassword())">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </span>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="text-danger">Password is required.</span>
      }
    </label>

    <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</section>
