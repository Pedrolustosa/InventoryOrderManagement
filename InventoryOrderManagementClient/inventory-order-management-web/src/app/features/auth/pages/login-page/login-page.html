<section class="relative mx-auto flex min-h-dvh max-w-md items-center px-4 py-12">
  <div
    class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--iom-primary-light),_transparent_55%),linear-gradient(180deg,_#eef4fa_0%,_var(--iom-background)_100%)]"
    aria-hidden="true"
  ></div>

  <form class="w-full space-y-6 rounded-2xl border border-line bg-panel p-6 shadow-sm" [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex flex-col items-center text-center">
      <img
        src="/assets/branding/logo-mark.png"
        width="72"
        height="72"
        class="size-[4.5rem] object-contain"
        [attr.alt]="'AUTH.LOGO_ALT' | translate"
      />
      <p class="mt-4 text-sm font-semibold tracking-wide text-accent">{{ 'COMMON.APP_NAME' | translate }}</p>
      <h1 class="mt-2 text-2xl font-semibold text-ink">{{ 'AUTH.SIGN_IN' | translate }}</h1>
      <p class="mt-2 text-sm text-muted">{{ 'AUTH.SIGN_IN_HINT' | translate }}</p>
    </div>

    @if (errorMessage()) {
      <p class="rounded-md border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <label class="block space-y-1 text-sm">
      <span class="font-medium text-ink">{{ 'AUTH.EMAIL' | translate }}</span>
      <input class="field" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="text-danger">{{ 'AUTH.EMAIL_INVALID' | translate }}</span>
      }
    </label>

    <label class="block space-y-1 text-sm">
      <span class="font-medium text-ink">{{ 'AUTH.PASSWORD' | translate }}</span>
      <span class="flex gap-2">
        <input
          class="field"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button type="button" class="btn-secondary shrink-0" (click)="showPassword.set(!showPassword())">
          {{ (showPassword() ? 'COMMON.HIDE' : 'COMMON.SHOW') | translate }}
        </button>
      </span>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="text-danger">{{ 'AUTH.PASSWORD_REQUIRED' | translate }}</span>
      }
    </label>

    <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting()">
      {{ (isSubmitting() ? 'AUTH.SIGNING_IN' : 'AUTH.SIGN_IN') | translate }}
    </button>
  </form>
</section>
