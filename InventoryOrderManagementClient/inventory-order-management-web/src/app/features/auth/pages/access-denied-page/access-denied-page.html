<section class="relative mx-auto flex min-h-dvh max-w-lg items-center px-4 py-12">
  <div
    class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--iom-primary-light),_transparent_55%),linear-gradient(180deg,_#eef4fa_0%,_var(--iom-background)_100%)]"
    aria-hidden="true"
  ></div>

  <div class="w-full space-y-4 rounded-2xl border border-line bg-panel p-6 shadow-sm">
    <div class="flex items-center gap-3">
      <img
        src="/assets/branding/logo-mark.png"
        width="48"
        height="48"
        class="size-12 object-contain"
        [attr.alt]="'AUTH.LOGO_ALT' | translate"
      />
      <p class="text-sm font-semibold tracking-wide text-accent">{{ 'COMMON.APP_NAME' | translate }}</p>
    </div>
    <h1 class="text-2xl font-semibold text-ink">{{ 'AUTH.ACCESS_DENIED' | translate }}</h1>
    <p class="text-sm text-muted">{{ 'AUTH.ACCESS_DENIED_HINT' | translate }}</p>
    <div class="flex flex-wrap gap-2">
      <a class="btn-primary" [routerLink]="home()">{{ 'AUTH.BACK_HOME' | translate }}</a>
      <button type="button" class="btn-secondary" (click)="signOut()">{{ 'SHELL.SIGN_OUT' | translate }}</button>
    </div>
  </div>
</section>
