<section class="relative mx-auto flex min-h-dvh max-w-md items-center px-4 py-12">
  <div
    class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--iom-primary-light),_transparent_55%),linear-gradient(180deg,_#eef4fa_0%,_var(--iom-background)_100%)]"
    aria-hidden="true"
  ></div>

  <form class="w-full space-y-6 rounded-2xl border border-line bg-panel p-6 shadow-sm" [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex flex-col items-center text-center">
      <img
        src="/assets/branding/logo-mark.png"
        width="64"
        height="64"
        class="size-16 object-contain"
        [attr.alt]="'AUTH.LOGO_ALT' | translate"
      />
      <p class="mt-4 text-sm font-semibold tracking-wide text-accent">{{ 'COMMON.APP_NAME' | translate }}</p>
      <h1 class="mt-2 text-2xl font-semibold text-ink">{{ 'AUTH.CHANGE_PASSWORD' | translate }}</h1>
      @if (forced()) {
        <p class="mt-2 text-sm text-muted">{{ 'AUTH.CHANGE_PASSWORD_FORCED' | translate }}</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="rounded-md border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <label class="block space-y-1 text-sm">
      <span class="font-medium">{{ 'AUTH.CURRENT_PASSWORD' | translate }}</span>
      <input class="field" type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>

    <label class="block space-y-1 text-sm">
      <span class="font-medium">{{ 'AUTH.NEW_PASSWORD' | translate }}</span>
      <input class="field" type="password" formControlName="newPassword" autocomplete="new-password" />
      <span class="text-xs text-muted">{{ 'AUTH.PASSWORD_POLICY_HINT' | translate }}</span>
      @if (form.controls.newPassword.touched && form.controls.newPassword.hasError('passwordPolicy')) {
        <span class="block text-danger">{{ 'AUTH.PASSWORD_POLICY_ERROR' | translate }}</span>
      }
    </label>

    <label class="block space-y-1 text-sm">
      <span class="font-medium">{{ 'AUTH.CONFIRM_PASSWORD' | translate }}</span>
      <input class="field" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.controls.confirmPassword.touched && form.controls.newPassword.value !== form.controls.confirmPassword.value) {
        <span class="text-danger">{{ 'AUTH.PASSWORD_MISMATCH' | translate }}</span>
      }
    </label>

    <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting()">
      {{ (isSubmitting() ? 'AUTH.SAVING_PASSWORD' : 'AUTH.SAVE_PASSWORD') | translate }}
    </button>
    <button type="button" class="btn-secondary w-full" (click)="signOut()">{{ 'SHELL.SIGN_OUT' | translate }}</button>
  </form>
</section>
