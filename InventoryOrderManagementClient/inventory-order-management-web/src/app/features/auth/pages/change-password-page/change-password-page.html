<section class="mx-auto flex min-h-dvh max-w-md items-center px-4 py-12">
  <form class="w-full space-y-6 rounded-2xl border border-line bg-panel p-6 shadow-sm" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-accent">Inventory Order Management</p>
      <h1 class="mt-2 text-2xl font-semibold text-ink">Change password</h1>
      @if (forced()) {
        <p class="mt-2 text-sm text-muted">Change the temporary password before using the application.</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="rounded-md border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <label class="block space-y-1 text-sm">
      <span class="font-medium">Current password</span>
      <input class="field" type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>

    <label class="block space-y-1 text-sm">
      <span class="font-medium">New password</span>
      <input class="field" type="password" formControlName="newPassword" autocomplete="new-password" />
      <span class="text-xs text-muted">At least 12 characters, with upper and lower case letters, a number, and a symbol.</span>
      @if (form.controls.newPassword.touched && form.controls.newPassword.hasError('passwordPolicy')) {
        <span class="block text-danger">The new password does not meet the policy.</span>
      }
    </label>

    <label class="block space-y-1 text-sm">
      <span class="font-medium">Confirm new password</span>
      <input class="field" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.controls.confirmPassword.touched && form.controls.newPassword.value !== form.controls.confirmPassword.value) {
        <span class="text-danger">The confirmation does not match the new password.</span>
      }
    </label>

    <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Saving...' : 'Save password' }}
    </button>
    <button type="button" class="btn-secondary w-full" (click)="signOut()">Sign out</button>
  </form>
</section>
