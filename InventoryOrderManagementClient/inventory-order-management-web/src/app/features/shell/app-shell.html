<div class="min-h-dvh bg-surface text-ink lg:flex" [class.overflow-hidden]="mobileOpen()">
  @if (!desktop() && mobileOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-ink/40"
      aria-label="Close menu"
      (click)="closeMobile()"
    ></button>
  }

  <app-sidebar
    class="fixed top-0 left-0 z-40 h-dvh border-r border-line bg-panel transition-transform duration-200 lg:sticky lg:z-0 lg:translate-x-0"
    [class.-translate-x-full]="!desktop() && !mobileOpen()"
    [class.translate-x-0]="desktop() || mobileOpen()"
    [class.w-64]="!desktop() || !collapsed()"
    [class.w-[4.5rem]]="desktop() && collapsed()"
    [class.pointer-events-none]="!desktop() && !mobileOpen()"
    [attr.aria-hidden]="!desktop() && !mobileOpen()"
    [attr.inert]="!desktop() && !mobileOpen() ? '' : null"
    [collapsed]="desktop() && collapsed()"
    (navigated)="closeMobile()"
  />

  <div class="min-w-0 flex-1">
    <app-navbar
      [menuExpanded]="menuExpanded()"
      [menuLabel]="menuLabel()"
      (menuToggled)="toggleMenu()"
      (signedOut)="signOut()"
    />
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
      <router-outlet />
    </main>
  </div>
</div>
