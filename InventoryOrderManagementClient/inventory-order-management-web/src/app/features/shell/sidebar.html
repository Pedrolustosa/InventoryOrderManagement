<div class="sidebar-shell flex h-full flex-col">
  <div
    class="flex h-16 items-center border-b px-3"
    style="border-color: var(--sidebar-border)"
    [class.justify-center]="collapsed()"
    [class.gap-3]="!collapsed()"
  >
    <img
      src="/assets/branding/logo-mark.png"
      width="40"
      height="40"
      class="size-10 shrink-0 object-contain"
      [attr.alt]="'AUTH.LOGO_ALT' | translate"
    />
    @if (!collapsed()) {
      <p class="min-w-0 truncate text-sm font-semibold tracking-wide" style="color: var(--sidebar-text)">
        {{ 'COMMON.APP_NAME' | translate }}
      </p>
    }
  </div>

  <nav class="flex-1 space-y-6 overflow-y-auto px-3 py-4" [attr.aria-label]="'SHELL.MAIN_NAV' | translate">
    @for (group of groups(); track group.labelKey) {
      <section>
        @if (!collapsed()) {
          <h2
            class="px-3 text-xs font-semibold uppercase tracking-[0.14em]"
            style="color: var(--sidebar-text-muted)"
          >
            {{ group.labelKey | translate }}
          </h2>
        }
        <ul class="mt-2 space-y-1" [class.mt-0]="collapsed()">
          @for (item of group.items; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                class="sidebar-link"
                [class.sidebar-link-active]="isActive(item.route)"
                [class.justify-center]="collapsed()"
                [attr.aria-current]="isActive(item.route) ? 'page' : null"
                [attr.aria-label]="item.labelKey | translate"
                [attr.title]="collapsed() ? (item.labelKey | translate) : null"
                (click)="navigated.emit()"
              >
                <app-nav-icon [name]="item.icon" />
                @if (!collapsed()) {
                  <span>{{ item.labelKey | translate }}</span>
                }
              </a>
            </li>
          }
        </ul>
      </section>
    }
  </nav>
</div>
