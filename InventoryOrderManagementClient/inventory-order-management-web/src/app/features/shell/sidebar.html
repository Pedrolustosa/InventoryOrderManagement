<div class="flex h-full flex-col">
  <div class="flex h-16 items-center border-b border-line px-4">
    <p class="truncate text-sm font-semibold tracking-wide text-accent">
      {{ collapsed() ? 'IOM' : 'Inventory Order Management' }}
    </p>
  </div>

  <nav class="flex-1 space-y-6 overflow-y-auto px-3 py-4" aria-label="Main">
    @for (group of groups(); track group.label) {
      <section>
        @if (!collapsed()) {
          <h2 class="px-3 text-xs font-semibold uppercase tracking-[0.14em] text-muted">{{ group.label }}</h2>
        }
        <ul class="mt-2 space-y-1" [class.mt-0]="collapsed()">
          @for (item of group.items; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                routerLinkActive="bg-accent/10 text-accent-ink"
                [routerLinkActiveOptions]="{ exact: false }"
                ariaCurrentWhenActive="page"
                class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-ink transition hover:bg-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
                [attr.aria-label]="item.label"
                [attr.title]="collapsed() ? item.label : null"
                (click)="navigated.emit()"
              >
                <app-nav-icon [name]="item.icon" />
                @if (!collapsed()) {
                  <span>{{ item.label }}</span>
                }
              </a>
            </li>
          }
        </ul>
      </section>
    }
  </nav>
</div>
